name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      - name: validate example
        working-directory: examples/basic
        run: |
          tofu init -backend=false
          tofu validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The test suite uses `mock_provider`, so it runs against Terraform rather
      # than OpenTofu to match what the module is developed against.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: init
        run: terraform init -backend=false

      - name: test
        run: terraform test
